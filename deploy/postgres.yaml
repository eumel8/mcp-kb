# PostgreSQL StatefulSet for mcp-kb
#
# Schema initialisation is handled by the db-migrate Job (migrate-job.yaml),
# NOT by docker-entrypoint-initdb.d.  Apply in this order:
#
#   kubectl apply -f deploy/postgres.yaml
#   kubectl apply -f deploy/migrate-job.yaml
#   kubectl -n observability-system wait --for=condition=complete \
#       job/db-migrate --timeout=120s
#   kubectl -n observability-system logs job/db-migrate

---
# Secret: PostgreSQL credentials
# In production manage via Sealed Secrets / External Secrets Operator / Vault.
# Do NOT commit plaintext secrets.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: observability-system
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: mcp-kb
type: Opaque
stringData:
  POSTGRES_USER:     mcpkb
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB:       mcpkb
---
# StatefulSet: PostgreSQL 16
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: observability-system
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: mcp-kb
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: mcp-kb
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - chown -R 999:999 /var/lib/postgresql/data && chmod 700 /var/lib/postgresql/data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
        # storageClassName: standard   # uncomment to pin a storage class
---
# Service: headless – required for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: observability-system
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: mcp-kb
spec:
  selector:
    app.kubernetes.io/name: postgres
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# Service: ClusterIP – used by mcp-kb and the migrate Job
apiVersion: v1
kind: Service
metadata:
  name: postgres-rw
  namespace: observability-system
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: mcp-kb
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
